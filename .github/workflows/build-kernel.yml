name: 编译内核 (Xiaomi K30S Ultra - apollo)

on:
  push:
    branches:
      - ubuntu-env
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    defaults:
      run:
        shell: bash
    steps:
      - name: 准备容器环境
        run: |
          apt update
          apt install -y sudo curl git tar gzip ca-certificates

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装基础编译依赖
        run: |
          apt update
          DEBIAN_FRONTEND=noninteractive apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 libncurses5 libncurses5-dev cpio

      - name: 缓存 Clang 工具链
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: ${{ runner.os }}-clang-r450784e-v1

      - name: 获取 AOSP Clang 工具链
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b master-kernel-build-2022 toolchain
          if [ ! -d "toolchain/clang-r450784e" ]; then
             echo "错误: 在分支 master-kernel-build-2022 中未找到预期版本的 Clang。"
             ls -F toolchain/
             exit 1
          fi

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: 设置编译环境变量 (LineageOS 23.2 / Android 16)
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "PATH=$(pwd)/toolchain/clang-r450784e/bin:$PATH" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "BASE_DEFCONFIG=vendor/kona-perf_defconfig" >> $GITHUB_ENV
          echo "MODEL_CONFIG=vendor/xiaomi/apollo.config" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$(pwd)/.ccache" >> $GITHUB_ENV

      - name: 执行内核编译
        id: build_kernel
        run: |
          mkdir -p out
          make O=out $BASE_DEFCONFIG
          cat arch/arm64/configs/$MODEL_CONFIG >> out/.config
          make O=out olddefconfig
          # 使用 ccache 加速编译
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 2>&1 | tee build.log

      - name: 发送 Telegram 通知
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ steps.build_kernel.outcome }}"
          COMMIT_ID=$(echo $GITHUB_SHA | cut -c1-8)
          
          if [[ "$STATUS" == "success" ]]; then
            MESSAGE="✅ <b>编译成功！</b>\n<b>项目:</b> ${GITHUB_REPOSITORY}\n<b>提交:</b> ${COMMIT_ID}"
          else
            # 提取错误日志的最后几行，并进行简单的 HTML 转义
            ERROR_LOG=$(tail -n 5 build.log | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            MESSAGE="❌ <b>编译失败！</b>\n<b>项目:</b> ${GITHUB_REPOSITORY}\n<b>提交:</b> ${COMMIT_ID}\n\n<b>错误摘要:</b>\n<pre>${ERROR_LOG}</pre>"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML"
