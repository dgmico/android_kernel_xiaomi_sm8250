name: 内核编译

on:
  push:
    branches: [main, lineage-23.2, 001]
  pull_request:
    branches: [main, lineage-23.2, 001]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev libc6-dev-i386 libncurses-dev \
            xsltproc unzip bc clang wget python3 libssl-dev \
            x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils cpio openjdk-17-jdk-headless apksigner

      - name: 下载 GCC 工具链
        run: |
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-9.3.git \
            ~/toolchain/gcc

      - name: 下载 Android NDK (Clang)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "$HOME/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 设置编译环境
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$HOME/toolchain/gcc/bin/aarch64-buildroot-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV

      - name: 配置内核
        run: |
          make vendor/kona_defconfig
          cat arch/arm64/configs/vendor/xiaomi/sm8250-common.config >> .config
          cat arch/arm64/configs/vendor/xiaomi/apollo.config >> .config
          # Android 16 (LineageOS 23.2) 必需配置
          echo "CONFIG_BPF_KPROBE_OVERRIDE=y" >> .config
          echo "CONFIG_BPF_EVENTS=y" >> .config
          echo "CONFIG_NET_CLS_ACT=y" >> .config
          echo "CONFIG_NET_SCH_INGRESS=y" >> .config
          echo "CONFIG_NET_ACT_BPF=y" >> .config
          echo "CONFIG_NET_CLS_BPF=y" >> .config
          make olddefconfig

      - name: 生成 SELinux 头文件
        run: |
          make scripts/selinux/genheaders/
          ./scripts/selinux/genheaders/genheaders security/selinux/flask.h security/selinux/av_permissions.h

      - name: 编译内核
        run: |
          make Image.gz-dtb -j$(nproc)

      - name: 获取当前日期
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: 创建可刷入 ZIP
        run: |
          # 克隆 AnyKernel3 模版
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          # 放入镜像
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          # 适配脚本
          sed -i 's/do.devicecheck=1/do.devicecheck=1/' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=apollo/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toro/device.name2=apollon/' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|block=auto|' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/' AnyKernel3/anykernel.sh
          # 权限
          chmod -R 755 AnyKernel3/
          # 打包 ZIP (核心修复：确保 META-INF 在根目录)
          cd AnyKernel3
          zip -r9 ../unsigned.zip . -x ".git*"
          cd ..

      - name: 签名 ZIP (解决签名验证失败)
        run: |
          wget -q https://github.com/aosp-mirror/platform_build/raw/master/target/product/security/testkey.pk8 -O testkey.pk8
          wget -q https://github.com/aosp-mirror/platform_build/raw/master/target/product/security/testkey.x509.pem -O testkey.x509.pem
          # 修复 apksigner: Exec format error，改用 java -jar
          # Ubuntu 20.04 中 apksigner 脚本有问题，我们直接找到 jar 包执行
          APKSIGNER_JAR=$(find /usr/lib/android-sdk/build-tools -name "apksigner.jar" | head -n 1 || echo "/usr/lib/android-sdk/build-tools/30.0.3/lib/apksigner.jar")
          if [ -f "$APKSIGNER_JAR" ]; then
            java -jar "$APKSIGNER_JAR" sign --key testkey.pk8 --cert testkey.x509.pem --out Kernel-apollo-${{ steps.date.outputs.date }}.zip unsigned.zip
          else
            # 兜底：如果找不到 jar 则尝试使用系统自带的，并捕获错误
            apksigner sign --key testkey.pk8 --cert testkey.x509.pem --out Kernel-apollo-${{ steps.date.outputs.date }}.zip unsigned.zip || true
          fi
          echo "ZIP_NAME=Kernel-apollo-${{ steps.date.outputs.date }}.zip" >> $GITHUB_ENV

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      - name: 发送 Telegram 通知
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          # 修复反引号转义问题，防止 shell 注入执行
          MSG_TEXT="$ICON Build $STATUS!%0A%0A*Branch:* \`${{ github.ref_name }}\`%0A*Commit:* \`${{ github.sha }}\`%0A*Workflow:* [${{ github.workflow }}](${{ github.run_url }})"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=$MSG_TEXT" \
            -d "parse_mode=Markdown"
