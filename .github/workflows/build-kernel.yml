name: 内核编译

on:
  push:
    branches: [main, lineage-23.2, 001]
  pull_request:
    branches: [main, lineage-23.2, 001]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev libc6-dev-i386 libncurses-dev \
            xsltproc unzip bc clang wget python3 libssl-dev \
            x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils

      - name: 下载 GCC 工具链
        run: |
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-9.3.git \
            ~/toolchain/gcc

      - name: 下载 Android NDK (Clang)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "$HOME/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 设置编译环境
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$HOME/toolchain/gcc/bin/aarch64-buildroot-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV

      - name: 配置内核
        run: |
          make defconfig
          make vendor/xiaomi/sm8250-common.config vendor/xiaomi/apollo.config
          grep -E "CONFIG_TASKS" .config

      - name: 生成 SELinux 头文件
        run: |
          make scripts/selinux/genheaders/
          make security/selinux/flask.h

      - name: 编译内核
        run: |
          make Image.gz-dtb -j$(nproc)

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: arch/arm64/boot/Image.gz-dtb
          retention-days: 7

      - name: 发送 Telegram 成功通知
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=✅ Build Success!%0A%0A*Branch:* \`${{ github.ref_name }}\`%0A*Commit:* \`${{ github.sha }}\`%0A*Workflow:* [${{ github.workflow }}](${{ github.run_url }})" \
            -d "parse_mode=Markdown"

      - name: 发送 Telegram 失败通知
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=❌ Build Failed!%0A%0A*Branch:* \`${{ github.ref_name }}\`%0A*Commit:* \`${{ github.sha }}\`%0A*Workflow:* [${{ github.workflow }}](${{ github.run_url }})" \
            -d "parse_mode=Markdown"
