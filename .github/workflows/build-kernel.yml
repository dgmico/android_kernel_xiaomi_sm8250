name: 内核编译

on:
  push:
    branches: [main, lineage-23.2, 001]
  pull_request:
    branches: [main, lineage-23.2, 001]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev libc6-dev-i386 libncurses-dev \
            xsltproc unzip bc clang wget python3 libssl-dev \
            x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils cpio cpio

      - name: 下载 GCC 工具链
        run: |
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-9.3.git \
            ~/toolchain/gcc

      - name: 下载 Android NDK (Clang)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "$HOME/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 设置编译环境
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$HOME/toolchain/gcc/bin/aarch64-buildroot-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV

      - name: 配置内核
        run: |
          make vendor/kona_defconfig
          cat arch/arm64/configs/vendor/xiaomi/sm8250-common.config >> .config
          cat arch/arm64/configs/vendor/xiaomi/apollo.config >> .config
          make olddefconfig

      - name: 生成 SELinux 头文件
        run: |
          make scripts/selinux/genheaders/
          ./scripts/selinux/genheaders/genheaders security/selinux/flask.h security/selinux/av_permissions.h

      - name: 编译内核
        run: |
          make Image.gz-dtb -j$(nproc)

      - name: 获取当前日期
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: 创建可刷入 ZIP
        run: |
          # 克隆 AnyKernel3 模版
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          # 放入内核镜像
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/

          # 配置 AnyKernel3 脚本 (适配 A/B 分区和自动路径)
          sed -i 's/do.devicecheck=1/do.devicecheck=1/' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=apollo/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toro/device.name2=apollon/' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=toroplus/device.name3=Mi 10T/' AnyKernel3/anykernel.sh
          sed -i 's/device.name4=/device.name4=K30S Ultra/' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|block=auto|' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/' AnyKernel3/anykernel.sh

          # 确保脚本权限正确
          chmod -R 755 AnyKernel3/

          # 打包 ZIP
          cd AnyKernel3
          zip -r ../unsigned.zip *
          cd ..

      - name: 签名 ZIP (解决签名验证失败)
        run: |
          # 下载 zipsigner
          wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner.jar -O zipsigner.jar
          # 使用 testkey 签名
          java -jar zipsigner.jar unsigned.zip Kernel-apollo-${{ steps.date.outputs.date }}.zip
          echo "ZIP_NAME=Kernel-apollo-${{ steps.date.outputs.date }}.zip" >> $GITHUB_ENV

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      - name: 发送 Telegram 成功通知
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=✅ Build Success!%0A%0A*Branch:* \`${{ github.ref_name }}\`%0A*Commit:* \`${{ github.sha }}\`%0A*Workflow:* [${{ github.workflow }}](${{ github.run_url }})" \
            -d "parse_mode=Markdown"

      - name: 发送 Telegram 失败通知
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=❌ Build Failed!%0A%0A*Branch:* \`${{ github.ref_name }}\`%0A*Commit:* \`${{ github.sha }}\`%0A*Workflow:* [${{ github.workflow }}](${{ github.run_url }})" \
            -d "parse_mode=Markdown"
