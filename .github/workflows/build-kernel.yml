name: Build Kernel for SM8250 (Redmi K30S Ultra)

on:
  push:
    branches:
      - sukisu
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lzip libssl-dev libelf-dev clang lld llvm-dev qemu-user-static git-core gnupg flex bison gperf libsdl1.1-dev libesd0-dev libwxgtk3.0-gtk3-dev squashfs-tools build-essential zip curl libncurses5-dev zlib1g-dev g++-multilib i386-runtime-lib-dev lib32z1-dev lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip m4 python3 python3-pip

      - name: Setup Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz
          mkdir clang && tar -xzf clang-r487747c.tar.gz -C clang
          curl -LO https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/master.tar.gz
          mkdir gcc64 && tar -xzf master.tar.gz -C gcc64
          curl -LO https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/master.tar.gz
          mkdir gcc32 && tar -xzf master.tar.gz -C gcc32

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          
          # 1. 基础配置 (Kona 是 865 代号)
          make O=out vendor/kona-perf_defconfig
          
          # 2. 合并 Xiaomi/Apollo 特色配置 (针对 apollon)
          scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/xiaomi/sm8250-common.config arch/arm64/configs/vendor/xiaomi/apollo.config
          
          # 3. 启用 KernelSU 和 必要内核特性
          ./scripts/config --file out/.config -e CONFIG_KPROBES
          ./scripts/config --file out/.config -e CONFIG_OVERLAY_FS
          ./scripts/config --file out/.config -e CONFIG_KSU
          
          # 4. 重新处理配置
          make O=out ARCH=arm64 CC=clang olddefconfig
          
          # 5. 正式编译 (SM8250 编译 Image.gz-dtb 是小米的标准)
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/Kernel-SU/AnyKernel3.git
          cd AnyKernel3
          # 修改 AnyKernel3 配置以支持 apollon
          sed -i 's/device.name1=maguro/device.name1=apollon/g' anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=apollo/g' anykernel.sh
          sed -i 's/device.name3=toro/device.name3=cas/g' anykernel.sh
          # 针对 SM8250 设备的典型 boot 分区配置 (AnyKernel3 通常能自动识别，这里做个双保险)
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/bootdevice/by-name/boot;|g' anykernel.sh
          
          # 拷贝编译出的内核镜像
          cp ../out/arch/arm64/boot/Image.gz-dtb .
          
          # 打包为 ZIP 文件
          ZIP_NAME="KernelSU-apollon-$(date +%Y%m%d-%H%M).zip"
          zip -r9 ../$ZIP_NAME * -x .git README.md *placeholder
          echo "ZIP_PATH=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Flashable_apollon
          path: ${{ env.ZIP_PATH }}
# Trigger Comment
