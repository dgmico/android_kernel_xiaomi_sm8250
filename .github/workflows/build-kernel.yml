name: 内核编译

on:
  push:
    branches: [main, lineage-23.2, 001]
  pull_request:
    branches: [main, lineage-23.2, 001]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev libc6-dev-i386 libncurses-dev \
            xsltproc unzip bc clang wget python3 libssl-dev \
            x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils cpio cpio

      - name: 下载 GCC 工具链
        run: |
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-9.3.git \
            ~/toolchain/gcc

      - name: 下载 Android NDK (Clang)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "$HOME/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 设置编译环境
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$HOME/toolchain/gcc/bin/aarch64-buildroot-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV

      - name: 配置内核
        run: |
          make vendor/kona_defconfig
          cat arch/arm64/configs/vendor/xiaomi/sm8250-common.config >> .config
          cat arch/arm64/configs/vendor/xiaomi/apollo.config >> .config
          make olddefconfig

      - name: 生成 SELinux 头文件
        run: |
          make scripts/selinux/genheaders/
          ./scripts/selinux/genheaders/genheaders security/selinux/flask.h security/selinux/av_permissions.h

      - name: 编译内核
        run: |
          make Image.gz-dtb -j$(nproc)

      - name: 获取当前日期
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "full_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: 创建可刷入 ZIP
        run: |
          # 创建 AnyKernel3 目录结构
          mkdir -p AnyKernel3
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/

          # 创建 anykernel.sh
          cat > AnyKernel3/anykernel.sh << 'EOF'
          kernel.string=LineageOS 23.2 for Xiaomi Redmi K30S Ultra
          device.name1=apollon
          device.name2=Mi 10T
          device.name3=K30S Ultra
          kernel.arch=arm64
          kernel.path=.
          kernel.image=Image.gz-dtb
          run.cmd=flash=zip $AnyKernel3/LineageOS_23.2_kernel.zip $AnyKernel3
          EOF

          # 创建 updater-script
          cat > AnyKernel3/updater-script << 'EOF'
          ui_print("****************************");
          ui_print("LineageOS 23.2 Kernel for Apollo");
          ui_print("****************************");
          show_progress(0.1, 0);
          ui_print("Flashing kernel...");
          package_extract_file("Image.gz-dtb", "/dev/block/bootdevice/by-name/boot");
          ui_print("Done!");
          show_progress(0.1, 10);
          EOF

          # 打包 ZIP
          cd AnyKernel3
          zip -r ../Kernel-apollo-${{ steps.date.outputs.date }}.zip *
          cd ..
          echo "ZIP_NAME=Kernel-apollo-${{ steps.date.outputs.date }}.zip" >> $GITHUB_ENV

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: build-apollo-${{ steps.date.outputs.date }}-${{ github.run_number }}
          name: Apollo 内核更新 - ${{ steps.date.outputs.full_date }}
          files: ${{ env.ZIP_NAME }}
          body: |
            ## Apollo (Xiaomi Mi 10T / K30S Ultra) 内核构建
            
            - **构建日期:** ${{ steps.date.outputs.full_date }}
            - **分支:** `${{ github.ref_name }}`
            - **提交哈希:** `${{ github.sha }}`
            - **工作流链接:** [点击查看](${{ github.run_url }})
            
            此构建由 GitHub Actions 自动生成。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发送 Telegram 成功通知
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=✅ Build Success!%0A%0A*Branch:* \`${{ github.ref_name }}\`%0A*Commit:* \`${{ github.sha }}\`%0A*Workflow:* [${{ github.workflow }}](${{ github.run_url }})" \
            -d "parse_mode=Markdown"

      - name: 发送 Telegram 失败通知
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=❌ Build Failed!%0A%0A*Branch:* \`${{ github.ref_name }}\`%0A*Commit:* \`${{ github.sha }}\`%0A*Workflow:* [${{ github.workflow }}](${{ github.run_url }})" \
            -d "parse_mode=Markdown"
