name: Build Kernel

on:
  push:
    branches:
      - sukisu-claude

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and build kernel
        run: |
          # Install build dependencies
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            python3 \
            python3-pip \
            ccache

          # Download and extract GCC toolchain
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          wget -q https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-9.3/archive/refs/heads/lineage-23.2.tar.gz -O gcc.tar.gz
          tar -xzf gcc.tar.gz

          # Set PATH for toolchain
          export PATH="$HOME/toolchain/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-9.3/lineage-23.2/bin:$PATH"

          # Verify toolchain
          ls -la $HOME/toolchain/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-9.3/lineage-23.2/bin
          which aarch64-linux-gnu-gcc

          # Go back to kernel directory
          cd $GITHUB_WORKSPACE

          # Setup KernelSU
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki || true

          # Enable CONFIG_KSU_MANUAL_HOOK
          if ! grep -q "CONFIG_KSU_MANUAL_HOOK=y" arch/arm64/configs/vendor/xiaomi/sm8250-common.config; then
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/vendor/xiaomi/sm8250-common.config
          fi

          # Build kernel
          ccache -M 10G
          ccache -z
          make vendor/kona-perf_defconfig
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LTO=thin
          ccache -s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/**/*.dtb
            vmlinux
