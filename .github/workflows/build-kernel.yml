name: Build Kernel

on:
  push:
    branches:
      - sukisu-claude

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            python3 \
            python3-pip \
            ccache

      - name: Setup GCC toolchain
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          wget -q https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/lineage-19.2.tar.gz -O gcc.tar.gz
          tar -xzf gcc.tar.gz

      - name: Cache GCC
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: ${{ runner.os }}-gcc-4.9-${{ hashFiles('$HOME/toolchain/*.tar.gz') }}

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki || true

      - name: Enable CONFIG_KSU_MANUAL_HOOK
        run: |
          if ! grep -q "CONFIG_KSU_MANUAL_HOOK=y" arch/arm64/configs/vendor/xiaomi/sm8250-common.config; then
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/vendor/xiaomi/sm8250-common.config
          fi

      - name: Build kernel
        env:
          PATH: $HOME/toolchain/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/lineage-19.2/bin:/usr/bin:/bin
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabihf-
          LTO: thin
          CCACHE_DIR: /tmp/ccache
        run: |
          ccache -M 10G
          ccache -z
          make vendor/kona-perf_defconfig
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LTO=thin CC=gcc CCACHE=ccache
          ccache -s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/**/*.dtb
            vmlinux
