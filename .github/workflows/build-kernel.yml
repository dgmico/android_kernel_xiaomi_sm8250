name: Build Kernel

on:
  push:
    branches:
      - sukisu-claude

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            python3 \
            python3-pip \
            ccache \
            clang \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki || true

      - name: Enable CONFIG_KSU_MANUAL_HOOK
        run: |
          if ! grep -q "CONFIG_KSU_MANUAL_HOOK=y" arch/arm64/configs/vendor/xiaomi/sm8250-common.config; then
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/vendor/xiaomi/sm8250-common.config
          fi

      - name: Build kernel
        run: |
          ccache -M 10G
          ccache -z
          make vendor/kona-perf_defconfig ARCH=arm64
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LTO=thin
          ccache -s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/**/*.dtb
            vmlinux
