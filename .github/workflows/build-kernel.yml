name: 编译内核 (Xiaomi K30S Ultra - apollo)

on:
  push:
    branches:
      - ubuntu-env
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    defaults:
      run:
        shell: bash
    steps:
      - name: 准备容器环境
        run: |
          apt update
          apt install -y sudo curl git tar gzip ca-certificates

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装基础编译依赖
        run: |
          apt update
          DEBIAN_FRONTEND=noninteractive apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 libncurses5 libncurses5-dev

      - name: 获取 AOSP Clang 工具链
        run: |
          # 放弃不稳定且受限的 curl +archive 下载，改用 git 浅克隆
          # 我们只需要获取特定版本的 Clang
          # 注意：由于 prebuilts 库极大，我们只检出特定的子目录
          mkdir -p toolchain
          cd toolchain
          git init
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          # 启用 Sparse Checkout 以仅获取特定的 Clang 版本目录 (r450784d)
          git config core.sparseCheckout true
          echo "clang-r450784d/*" > .git/info/sparse-checkout
          git pull --depth 1 origin master
          # 将其移动到顶层以便后续路径引用更简单
          mv clang-r450784d/* .
          rm -rf clang-r450784d

      - name: 设置编译环境变量 (LineageOS 23.2 / Android 16)
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          # 指向解压后的 clang/bin
          echo "PATH=$(pwd)/toolchain/bin:$PATH" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "BASE_DEFCONFIG=vendor/kona-perf_defconfig" >> $GITHUB_ENV
          echo "MODEL_CONFIG=vendor/xiaomi/apollo.config" >> $GITHUB_ENV

      - name: 执行内核编译
        id: build_kernel
        run: |
          mkdir -p out
          make O=out $BASE_DEFCONFIG
          cat arch/arm64/configs/$MODEL_CONFIG >> out/.config
          make O=out olddefconfig
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1
        continue-on-error: true

      - name: 发送 Telegram 通知
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ steps.build_kernel.outcome }}"
          if [[ "$STATUS" == "success" ]]; then
            RESULT_TEXT="✅ 编译成功！(Xiaomi K30S Ultra - Android 16)"
          else
            RESULT_TEXT="❌ 编译失败。(Xiaomi K30S Ultra - Android 16)"
          fi
          
          COMMIT_ID=$(echo $GITHUB_SHA | cut -c1-8)
          MESSAGE="<b>项目:</b> ${GITHUB_REPOSITORY}\n<b>分支:</b> ${GITHUB_REF_NAME}\n<b>状态:</b> ${RESULT_TEXT}\n<b>提交信息:</b> ${COMMIT_ID}"
          
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML"
