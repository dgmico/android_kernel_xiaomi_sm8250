name: Build Kernel

on:
  push:
    branches:
      - sukisu-openclaw
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sukisu-openclaw
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl libssl-dev libelf-dev bc flex bison python3 wget zstd

      - name: 下载 Android Clang 工具链
        run: |
          wget -q https://github.com/ClangBuiltLinux/tc-build/releases/download/2024-01-06/aarch64-linux-gnu-13.0.0.tar.zst -O /tmp/aarch64.tar.zst
          sudo tar -C / -xf /tmp/aarch64.tar.zst
          wget -q https://github.com/ClangBuiltLinux/tc-build/releases/download/2024-01-06/clang-17.0.0.tar.zst -O /tmp/clang.tar.zst
          sudo tar -C / -xf /tmp/clang.tar.zst

      - name: 设置环境变量
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CC=/usr/bin/clang" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=/usr/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=/usr/bin/arm-linux-gnueabihf-" >> $GITHUB_ENV

      - name: 配置内核
        run: make vendor/xiaomi/apollo.config

      - name: 编译内核
        run: make -j$(nproc) Image.gz-dtb

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image.gz-dtb
          path: arch/arm64/boot/Image.gz-dtb
          retention-days: 7

      - name: 上传设备树
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtb
          path: arch/arm64/boot/dts/
          retention-days: 7

      - name: Telegram 通知
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔨 *内核编译 ${{ job.status }}*
            - 分支: ${{ github.ref }}
            - 提交: ${{ github.sha }}
            - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        if: always()
