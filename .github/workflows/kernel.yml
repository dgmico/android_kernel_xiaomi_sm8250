name: Build Kernel

on:
  push:
    branches:
      - sukisu-openclaw
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sukisu-openclaw
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl libssl-dev libelf-dev bc flex bison python3

      - name: 设置环境变量
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: 配置内核
        run: make vendor/xiaomi/apollo.config

      - name: 编译内核
        run: make -j$(nproc) Image.gz-dtb

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image.gz-dtb
          path: arch/arm64/boot/Image.gz-dtb
          retention-days: 7

      - name: 上传设备树
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtb
          path: arch/arm64/boot/dts/
          retention-days: 7
