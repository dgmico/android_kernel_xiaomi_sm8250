name: Build Kernel

on:
  push:
    branches:
      - sukisu-openclaw
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sukisu-openclaw
          fetch-depth: 1

      - name: 安装依赖
        run: |
          apt-get update
          apt-get install -y build-essential git curl libssl-dev libelf-dev bc flex bison python3 wget gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: 安装 unzip
        run: apt-get install -y unzip

      - name: 下载 Android Clang 工具链
        run: |
          curl -Lo /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q /tmp/ndk.zip -d /opt/
          ls /opt/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/ | head -5

      - name: 配置工具链路径
        run: |
          # 创建符号链接到系统路径
          ln -sf /opt/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang /usr/local/bin/aarch64-linux-android33-clang
          ln -sf /opt/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang /usr/local/bin/aarch64-linux-android33-gcc
          ln -sf /opt/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/clang /usr/local/bin/clang
          # 创建 armv8a clang 链接 (某些配置需要)
          ln -sf /opt/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang /usr/local/bin/aarch64-linux-android33
          # 创建 ld 链接 (使用系统 ld.aarch6464)
          ln -sf /usr/bin/aarch64-linux-gnu-ld /usr/local/bin/aarch64-linux-android33-ld
          # 创建 objdump, nm, ar, objcopy, strip 链接 (NDK 不提供这些工具，使用系统交叉编译工具链)
          ln -sf /usr/bin/aarch64-linux-gnu-objdump /usr/local/bin/aarch64-linux-android33-objdump
          ln -sf /usr/bin/aarch64-linux-gnu-nm /usr/local/bin/aarch64-linux-android33-nm
          ln -sf /usr/bin/aarch64-linux-gnu-ar /usr/local/bin/aarch64-linux-android33-ar
          ln -sf /usr/bin/aarch64-linux-gnu-objcopy /usr/local/bin/aarch64-linux-android33-objcopy
          ln -sf /usr/bin/aarch64-linux-gnu-strip /usr/local/bin/aarch64-linux-android33-strip
          which aarch64-linux-android33-clang
          which aarch64-linux-android33-gcc
          which aarch64-linux-android33-ld
          which aarch64-linux-android33-objdump
          which aarch64-linux-android33-nm
          which aarch64-linux-android33-ar
          which clang

      - name: 设置环境变量
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CC=aarch64-linux-android33-clang" >> $GITHUB_ENV
          echo "HOSTCC=clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android33-" >> $GITHUB_ENV
          echo "PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin" >> $GITHUB_ENV

      - name: 配置内核
        run: |
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
          cp arch/arm64/configs/vendor/xiaomi/apollo.config .config
          yes "" | make oldconfig
          # 启用 CONFIG_COMPAT 解决 compat_uptr_t 类型未定义错误
          # filter.h 中的 struct compat_sock_fprog 需要 compat_uptr_t 类型
          sed -i 's/# CONFIG_COMPAT is not set/CONFIG_COMPAT=y/' .config
          # 启用 CONFIG_PREEMPT 以启用 TASKS_RCU (TASKS_RCU def_bool PREEMPT)
          # 避免 struct rcu_tasks 不完整错误
          echo "CONFIG_PREEMPT=y" >> .config
          echo "CONFIG_TASKS_RCU=y" >> .config
          grep -E "CONFIG_COMPAT|CONFIG_PREEMPT|CONFIG_TASKS_RCU" .config

      - name: 编译内核
        run: make -j$(nproc) Image.gz-dtb

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image.gz-dtb
          path: arch/arm64/boot/Image.gz-dtb
          retention-days: 7

      - name: 上传设备树
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtb
          path: arch/arm64/boot/dts/
          retention-days: 7

      - name: Telegram 通知
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔨 *内核编译 ${{ job.status }}*
            - 分支: ${{ github.ref }}
            - 提交: ${{ github.sha }}
            - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        if: always()
