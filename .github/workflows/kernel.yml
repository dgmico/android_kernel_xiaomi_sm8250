name: Build Kernel

on:
  push:
    branches:
      - sukisu-openclaw
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sukisu-openclaw
          fetch-depth: 1

      - name: 安装依赖
        run: |
          apt-get update
          apt-get install -y build-essential git curl libssl-dev libelf-dev bc flex bison python3 wget

      - name: 安装 unzip
        run: apt-get install -y unzip

      - name: 下载 Android Clang 工具链
        run: |
          curl -Lo /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q /tmp/ndk.zip -d /opt/
          ls /opt/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/ | head -5

      - name: 设置环境变量
        run: |
          export PATH="/opt/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CC=aarch64-linux-android33-clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android33-" >> $GITHUB_ENV
          echo "PATH=/opt/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> $GITHUB_ENV

      - name: 配置内核
        run: |
          export PATH="/opt/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cp arch/arm64/configs/vendor/xiaomi/apollo.config .config
          yes "" | make oldconfig

      - name: 编译内核
        run: |
          export PATH="/opt/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make -j$(nproc) Image.gz-dtb

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image.gz-dtb
          path: arch/arm64/boot/Image.gz-dtb
          retention-days: 7

      - name: 上传设备树
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtb
          path: arch/arm64/boot/dts/
          retention-days: 7

      - name: Telegram 通知
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔨 *内核编译 ${{ job.status }}*
            - 分支: ${{ github.ref }}
            - 提交: ${{ github.sha }}
            - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        if: always()
