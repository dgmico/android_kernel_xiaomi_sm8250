name: 编译内核 (AnyKernel3 v13 - Final Stand)

on:
  workflow_dispatch:
  push:
    branches:
      - ubuntu-env

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装基础编译依赖
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 libncurses5 libncurses5-dev cpio unzip

      - name: 获取 AOSP Clang 工具链
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b master-kernel-build-2022 toolchain

      - name: 执行内核编译
        run: |
          export PATH=$(pwd)/toolchain/clang-r450784e/bin:$PATH
          mkdir -p out
          
          # 1. 注入调试配置 (PSTORE)
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/kona-perf_defconfig
          echo "CONFIG_PSTORE=y" >> arch/arm64/configs/vendor/kona-perf_defconfig
          echo "CONFIG_PSTORE_CONSOLE=y" >> arch/arm64/configs/vendor/kona-perf_defconfig
          echo "CONFIG_PSTORE_RAM=y" >> arch/arm64/configs/vendor/kona-perf_defconfig
          echo "CONFIG_PANIC_TIMEOUT=5" >> arch/arm64/configs/vendor/kona-perf_defconfig
          
          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          cat arch/arm64/configs/vendor/xiaomi/apollo.config >> out/.config
          
          # 2. 确保配置生效
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_PSTORE=y" >> out/.config
          echo "CONFIG_PSTORE_CONSOLE=y" >> out/.config
          echo "CONFIG_PSTORE_PMSG=y" >> out/.config
          echo "CONFIG_PSTORE_RAM=y" >> out/.config
          
          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1

      - name: AnyKernel3 打包 (v13 - Final Stand)
        run: |
          # 1. 获取最新 AnyKernel3 框架
          git clone https://github.com/osm0sis/AnyKernel3 --depth 1
          cd AnyKernel3
          
          # 2. 配置 AnyKernel3 针对 apollon
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/is_slot_device=1/is_slot_device=0/g' anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|block=/dev/block/bootdevice/by-name/boot|g' anykernel.sh
          
          # 3. 集成 MagiskBoot v28
          curl -L "https://github.com/Topjohnwu/Magisk/releases/download/v28.0/Magisk-v28.0.apk" -o magisk.zip
          unzip -j magisk.zip "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          
          # 4. 拷贝内核产物
          if [ -f "../out/arch/arm64/boot/Image.gz" ]; then
            cp ../out/arch/arm64/boot/Image.gz .
          else
            cp ../out/arch/arm64/boot/Image .
          fi
          
          # 5. 注入 AVB Patch 逻辑
          # 我们先创建一个 patch.sh，然后在 anykernel.sh 中调用它，避免复杂的 sed 嵌套
          cat << 'EOF' > patch.sh
#!/sbin/sh
ui_print "- Executing local AVB Patch (Kona)..."
./magiskboot hexpatch "$split_img/kernel" 736B69705F696E697472616D667300 77616E745F696E697472616D667300 || true
EOF
          chmod +x patch.sh
          
          # 修改 anykernel.sh 在合适位置调用 patch.sh
          sed -i '/split_boot;/a . ./patch.sh' anykernel.sh

          # 6. 打包 ZIP
          DATE=$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M)
          ZIP_NAME="apollon-ak3-v13-${DATE}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          zip -r9 "../${ZIP_NAME}" * -x .git* -x README.md -x LICENSE
          cd ..

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
