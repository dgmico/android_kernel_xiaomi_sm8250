name: 编译内核 (S3 Rebuild v9 - Minimal Flash)

on:
  workflow_dispatch:
  push:
    branches:
      - ubuntu-env

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装基础编译依赖
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 libncurses5 libncurses5-dev cpio unzip

      - name: 获取 AOSP Clang 工具链
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b master-kernel-build-2022 toolchain

      - name: 执行内核编译
        run: |
          export PATH=$(pwd)/toolchain/clang-r450784e/bin:$PATH
          mkdir -p out
          # 开启 KernelSU 并注入 netfilter 补丁
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/kona-perf_defconfig
          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          cat arch/arm64/configs/vendor/xiaomi/apollo.config >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1

      - name: S3 Rebuild (重组 Boot 镜像)
        run: |
          # 1. 获取最新 magiskboot (x86_64)
          curl -L "https://github.com/Topjohnwu/Magisk/releases/download/v28.0/Magisk-v28.0.apk" -o magisk.zip
          unzip -j magisk.zip "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          
          # 2. 解包原厂 boot (必须确保 boot-truncated.img 在仓库根目录)
          mkdir unpack_tmp
          cp boot-truncated.img magiskboot unpack_tmp/
          cd unpack_tmp
          ./magiskboot unpack boot-truncated.img
          
          # 3. 替换内核并禁用 AVB
          if [ -f "../out/arch/arm64/boot/Image" ]; then
            cp ../out/arch/arm64/boot/Image kernel
          else
            cp ../out/arch/arm64/boot/Image.gz kernel
          fi
          
          # 尝试禁用 AVB (Kona 平台关键)
          ./magiskboot hexpatch kernel 736B69705F696E697472616D667300 77616E745F696E697472616D667300 || true
          
          # 4. 重组 boot.img
          ./magiskboot repack boot-truncated.img ../boot.img
          cd ..
          
          # 5. 处理 DTBO (保持原始性以防校验失败)
          if [ -f "out/arch/arm64/boot/dts/vendor/qcom/apollo-sm8250-overlay.dtbo" ]; then
            cp out/arch/arm64/boot/dts/vendor/qcom/apollo-sm8250-overlay.dtbo dtbo.img
          fi

      - name: 准备极简刷机包 (dd script)
        run: |
          # 准备目录结构
          mkdir -p flash_zip/META-INF/com/google/android
          
          # 复制镜像
          [ -f "boot.img" ] && mv boot.img flash_zip/
          [ -f "dtbo.img" ] && mv dtbo.img flash_zip/
          
          # 创建极简 update-binary 脚本
          cat << 'EOF' > flash_zip/META-INF/com/google/android/update-binary
          #!/sbin/sh
          # 极简刷机脚本 - 修复 Fastboot 引导循环

          ui_print() {
            echo "$1"
          }

          ui_print "--------------------------------------"
          ui_print " S3 Rebuild Flash Script (v10) "
          ui_print " Redmi K30S Ultra (apollon) "
          ui_print "--------------------------------------"

          ZIPFILE=$3
          TMPDIR=/tmp/kernel_install
          mkdir -p $TMPDIR

          ui_print "- Extracting images..."
          unzip -o "$ZIPFILE" "boot.img" "dtbo.img" -d $TMPDIR

          if [ -f "$TMPDIR/boot.img" ]; then
            ui_print "- Flashing boot.img (AVB Patched)..."
            dd if=$TMPDIR/boot.img of=/dev/block/bootdevice/by-name/boot
          fi

          if [ -f "$TMPDIR/dtbo.img" ]; then
            # 某些环境下直接 dd 原始 dtbo 会进 fastboot，这里先尝试仅刷 boot
            ui_print "- Warning: Flashing dtbo.img..."
            dd if=$TMPDIR/dtbo.img of=/dev/block/bootdevice/by-name/dtbo
          fi

          ui_print "- Cleaning up..."
          rm -rf $TMPDIR

          ui_print "--------------------------------------"
          ui_print " Installation Successful! "
          ui_print " Please reboot system. "
          ui_print "--------------------------------------"
          exit 0
          EOF
          chmod 755 flash_zip/META-INF/com/google/android/update-binary
          
          # 创建空的 updater-script (有些 Recovery 需要它)
          touch flash_zip/META-INF/com/google/android/updater-script

      - name: 打包产物
        run: |
          DATE=$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M)
          ZIP_NAME="apollon-s3-ksu-v28-${DATE}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          
          cd flash_zip
          zip -r9 "../${ZIP_NAME}" *
          cd ..

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
