name: 极简内核编译 (Minimal Test)

on:
  push:
    branches:
      - ubuntu-env
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    defaults:
      run:
        shell: bash
    steps:
      - name: 准备环境
        run: |
          apt update
          DEBIAN_FRONTEND=noninteractive apt install -y sudo curl git tar gzip ca-certificates bc bison build-essential ccache flex g++-multilib gcc-multilib git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 libncurses5 libncurses5-dev cpio

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 获取工具链
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b master-kernel-build-2022 toolchain

      - name: 执行极简编译
        run: |
          export PATH=$(pwd)/toolchain/clang-r450784e/bin:$PATH
          mkdir -p out
          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          cat arch/arm64/configs/vendor/xiaomi/apollo.config >> out/.config
          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1

      - name: 极简 AnyKernel3 打包
        run: |
          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image anykernel3/
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz anykernel3/
          fi
          # 尝试包含 DTB
          if [ -f "out/arch/arm64/boot/dts/vendor/qcom/kona-v2.dtb" ]; then
            cp out/arch/arm64/boot/dts/vendor/qcom/kona-v2.dtb anykernel3/dtb
          fi
          cd anykernel3
          # 清理一下，只留最核心的
          rm -f dtbo.img Image.gz-dtb
          zip -r9 "../minimal-apollon.zip" * -x .git* -x README.md -x LICENSE
          cd ..

      - name: 上传极简产物
        uses: actions/upload-artifact@v4
        with:
          name: minimal-kernel
          path: minimal-apollon.zip
